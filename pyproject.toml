[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-runstore"
version = "0.1.0"
description = "Run storage of ds-init projects: the run folder format, reading, compacting, run state, example run."
readme = "README.md"
requires-python = ">=3.11"
# Wide ranges on purpose: the package is installed next to very different environments
# (a pinned torch project, a slim web-tool container).
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ds_runstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
